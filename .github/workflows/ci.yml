name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check backend/
      - name: ruff format --check
        run: ruff format --check backend/

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install bandit[toml] pip-audit
      - name: Bandit (Medium+)
        run: bandit -r backend/ -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict || true

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests
        run: |
          python -m pytest backend/tests/ -q --no-header \
            --cov=backend --cov-report=term --cov-fail-under=59
        env:
          JST_ENV: dev
          JST_TRUSTED_HOSTS: "testserver,localhost,127.0.0.1"
          JST_REAL_ENGINE: "0"
