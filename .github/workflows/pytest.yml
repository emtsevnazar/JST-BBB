name: pytest

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest backend/tests -v --no-header --cov=backend --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=54
