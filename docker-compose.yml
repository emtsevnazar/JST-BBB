# v1.8.6: docker-compose для локальной разработки / продакшена
services:
  jst-studio:
    build: .
    image: jst-studio:latest
    container_name: jst-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      JST_ENV: ${JST_ENV:-dev}
      JST_ADMIN_TOKEN: ${JST_ADMIN_TOKEN:?JST_ADMIN_TOKEN required}
      JST_API_KEY: ${JST_API_KEY:-}
      JST_TRUSTED_HOSTS: ${JST_TRUSTED_HOSTS:-localhost,127.0.0.1}
      JST_ALLOWED_ORIGINS: ${JST_ALLOWED_ORIGINS:-http://localhost:8000}
      JST_SENTRY_DSN: ${JST_SENTRY_DSN:-}
    volumes:
      - jst_output:/app/output
      - jst_logs:/app/logs
      - jst_voices:/app/voices
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  jst_output:
  jst_logs:
  jst_voices:
