<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>JST Error</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
body { background: url('/static/img/ph_b2.png') center/cover no-repeat fixed #2a0606; min-height: 100vh; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(calc(100% + 40px)); z-index: 100; display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(520px, calc(100vw - 32px)); padding: 12px 16px; background: #c62828; border: 2px solid #ef5350; border-radius: 12px; box-shadow: 0 8px 32px rgba(198,40,40,.55), 0 0 0 1px rgba(255,255,255,.08) inset; animation: slideUp .5s cubic-bezier(.34,1.56,.64,1) .15s forwards; }
@keyframes slideUp { to { transform: translateX(-50%) translateY(0); } }
.toast-icon { flex-shrink: 0; width: 28px; height: 28px; color: #ffeb3b; display: flex; align-items: center; justify-content: center; }
.toast-icon svg { width: 100%; height: 100%; display: block; }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: 13.5px; font-weight: 700; color: #ffeb3b; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast-msg { font-size: 12px; color: #fff59d; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.toast-btn { flex-shrink: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid #ffeb3b; color: #ffeb3b; border-radius: 8px; cursor: pointer; }
.toast-btn:hover { background: rgba(255,235,59,.18); }
.toast-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<noscript><meta http-equiv="refresh" content="5;url=/"></noscript>
<div class="toast" role="alert">
  <div class="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </div>
  <div class="toast-body">
    <div class="toast-title" id="t-title">Ошибка</div>
    <div class="toast-msg" id="t-msg">Проверяем состояние сервера…</div>
  </div>
  <button class="toast-btn" id="t-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>
</div>
<script>
(function(){
  console.log('[error] v4 loaded');
  var POLL = 1000, redirecting = false, fails = 0, lastV = null, timer = null;
  var T = document.getElementById('t-title'), M = document.getElementById('t-msg'), B = document.getElementById('t-btn');

  function goHome() {
    if (redirecting) return;
    redirecting = true;
    console.log('[error] redirecting to /');
    if (timer) { clearTimeout(timer); timer = null; }
    try { window.location.replace('/?_t=' + Date.now() + '&from=error'); }
    catch(e) { window.location.href = '/?_t=' + Date.now(); }
    setTimeout(function(){
      if (window.location.pathname.indexOf('/error') === 0) window.location.reload();
    }, 1500);
  }

  function sched() {
    if (timer) { clearTimeout(timer); timer = null; }
    timer = setTimeout(check, POLL);
  }

  function check() {
    if (redirecting) return;
    fetch('/api/error-state?_t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        fails = 0;
        console.log('[error] poll:', d && d.healthy, d && d.error && d.error.code);
        if (d && d.healthy === true) { goHome(); return; }
        if (d && d.error) {
          if (lastV === null || d.version !== lastV) {
            T.textContent = (d.error.code || '?') + (d.error.message ? ' · ' + d.error.message : '');
            M.textContent = 'Источник: ' + (d.error.source || '?') + ' · ждём восстановления';
            lastV = d.version;
          }
        }
        sched();
      })
      .catch(function(e){
        fails++;
        console.warn('[error] poll failed:', e);
        T.textContent = 'Сервер недоступен';
        M.textContent = 'Ждём восстановления (' + fails + ')';
        sched();
      });
  }

  B.addEventListener('click', function(){
    fetch('/api/error-state?_t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.healthy === true) goHome(); })
      .catch(function(){});
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !redirecting) {
      if (timer) { clearTimeout(timer); timer = null; }
      check();
    }
  });

  check();
})();
</script>
</body>
</html>
