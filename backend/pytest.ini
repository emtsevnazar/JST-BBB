[pytest]
markers =
    real_engine: требует реальных весов (~2GB) и загрузки Engine;
                 запуск: JST_REAL_ENGINE=1 pytest -m real_engine
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=backend --cov-report=term-missing --cov-config=../.coveragerc --cov-fail-under=59
