<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ошибка — Voice Forge Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#fff;background:#0a0a0a}
/* ФОН = чистый ph_b2.png (без overlay) */
body{
  background:#0a0a0a url('/static/img/ph_b2.png') center/cover no-repeat fixed;
}

/* КОМПАКТНЫЙ TOAST СНИЗУ */
.toast{
  position:fixed;left:50%;bottom:20px;
  transform:translateX(-50%) translateY(calc(100% + 40px));
  z-index:10;
  display:flex;align-items:center;gap:12px;
  width:max-content;max-width:min(480px,calc(100vw - 32px));
  padding:11px 14px;
  background:rgba(18,18,18,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-left:3px solid #e53935;
  border-radius:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) .1s forwards;
}
@keyframes slideUp{to{transform:translateX(-50%) translateY(0)}}

.toast-icon{font-size:20px;flex-shrink:0;line-height:1}
.toast-body{flex:1;min-width:0}
.toast-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-msg{font-size:11.5px;color:#a8a8a8;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toast-btn{
  flex-shrink:0;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(229,57,53,.15);
  border:1px solid rgba(229,57,53,.45);
  color:#ff8a80;
  border-radius:7px;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:background .15s,transform .1s;
}
.toast-btn:hover{background:rgba(229,57,53,.32)}
.toast-btn:active{transform:scale(.92)}
</style>
</head>
<body>
<div class="toast" role="alert" aria-live="assertive">
  <div class="toast-icon" id="t-icon">⚠️</div>
  <div class="toast-body">
    <div class="toast-title" id="t-title">Что-то пошло не так</div>
    <div class="toast-msg" id="t-msg">Проверьте подключение или попробуйте позже</div>
  </div>
  <button class="toast-btn" id="t-btn" onclick="location.reload()" title="Обновить" aria-label="Обновить">↻</button>
</div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var r=p.get('reason')||(p.get('code')==='404'?'notfound':p.get('code')==='500'?'server':'unknown');
  var s=p.get('status')||p.get('code')||'';
  var M={
    offline:{i:'📡',t:'Нет подключения',x:'Интернет недоступен. Проверьте сеть.'},
    notfound:{i:'🔍',t:'Страница не найдена',x:'Проверьте URL или вернитесь на главную.'},
    server:{i:'🔥',t:'Ошибка сервера',x:'Сервер не смог обработать запрос.'},
    network:{i:'📡',t:'Нет связи',x:'Не удаётся связаться с сервером.'},
    exception:{i:'⚠️',t:'Ошибка загрузки',x:'Обновите страницу или попробуйте позже.'},
    unknown:{i:'⚠️',t:'Что-то пошло не так',x:'Проверьте подключение или повторите позже.'}
  };
  var m=M[r]||M.unknown;
  document.getElementById('t-icon').textContent=m.i;
  document.getElementById('t-title').textContent=m.t+(s?' · HTTP '+s:'');
  document.getElementById('t-msg').textContent=m.x;
  // Клик по фону (не по toast) → на главную
  document.body.addEventListener('click',function(e){
    if(e.target===document.body)location.href='/';
  });
  // Esc → на главную
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')location.href='/';
  });
})();
</script>
</body>
</html>
