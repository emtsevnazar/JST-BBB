<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JST · Offline</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #000 center/cover no-repeat;
  background-image: url('/static/img/ph_b7.png');
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 40px;
}
.error-box {
  background: rgba(0,0,0,0.82); border: 3px solid #ff3b30; border-radius: 12px;
  padding: 24px 32px; max-width: 640px; text-align: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(255,59,48,0.4);
}
.error-title { font-size: 22px; font-weight: 700; color: #ff453a; margin-bottom: 8px; }
.error-msg { font-size: 15px; color: #ddd; margin-bottom: 16px; line-height: 1.5; }
.error-code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; color: #999; margin-top: 8px; }
.retry { background: #ff3b30; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-width: 140px; min-height: 44px; }
.retry:hover { background: #d92d20; }
@media (max-width: 480px) { body { padding: 20px; } .error-box { padding: 20px; } .error-title { font-size: 18px; } }
</style>
</head>
<body>
<div class="error-box">
  <div class="error-title" id="err-title">Нет соединения</div>
  <div class="error-msg" id="err-msg">Сервер недоступен. Проверьте интернет и повторите.</div>
  <div class="error-code" id="err-code"></div>
  <button class="retry" onclick="location.reload()">Обновить</button>
</div>
<script>
(function() {
  var p = new URLSearchParams(location.search);
  var code = p.get('code');
  var msg = p.get('msg');
  var lang = localStorage.getItem('jst-lang') || 'ru';
  var T = lang === 'en'
    ? { title: 'No connection', msg: 'Server unavailable. Check internet and retry.', retry: 'Reload' }
    : { title: 'Нет соединения', msg: 'Сервер недоступен. Проверьте интернет и повторите.', retry: 'Обновить' };
  document.getElementById('err-title').textContent = T.title;
  document.querySelector('.retry').textContent = T.retry;
  if (code) document.getElementById('err-code').textContent = 'HTTP ' + code;
  document.getElementById('err-msg').textContent = msg || T.msg;
  window.addEventListener('online', function() { setTimeout(function() { location.href = '/'; }, 800); });
})();
</script>
</body>
</html>
