<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Ошибка — Voice Forge Studio</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#0a0a0a}
    /* ФОН = ph_b2.png, на весь экран */
    .error-overlay{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:url('/static/ph_b2.png') center/cover no-repeat,
                 radial-gradient(circle,#1a1a1a 0%,#000 100%);
      z-index:9999}
    .error-overlay::before{content:'';position:absolute;inset:0;
      background:rgba(0,0,0,.55)}
    /* ВСПЛЫВАЮЩАЯ РАМКА */
    .error-box{
      position:relative;z-index:2;max-width:min(560px,90vw);
      padding:clamp(1.5rem,4vw,3rem);
      background:rgba(20,20,20,.94);
      border:4px solid #e53935;
      border-radius:16px;
      box-shadow:0 0 0 1px rgba(229,57,53,.3),
                 0 20px 60px rgba(0,0,0,.8),
                 0 0 80px rgba(229,57,53,.25);
      text-align:center;
      animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
    @keyframes popIn{from{opacity:0;transform:scale(.9) translateY(12px)}
                     to{opacity:1;transform:scale(1) translateY(0)}}
    .error-icon{font-size:clamp(2.5rem,8vw,4rem);line-height:1;margin-bottom:.75rem}
    .error-title{font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;
      color:#fff;margin-bottom:.5rem}
    .error-code{display:inline-block;font-family:ui-monospace,"SF Mono",monospace;
      font-size:.75rem;color:#ff8a80;background:rgba(229,57,53,.15);
      padding:.25rem .6rem;border-radius:6px;margin-bottom:1rem}
    .error-text{font-size:clamp(.85rem,2vw,1rem);color:#b0b0b0;
      line-height:1.5;margin-bottom:1.5rem}
    .error-actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
    .btn{min-height:44px;padding:.7rem 1.4rem;font-size:clamp(.85rem,2vw,1rem);
      font-weight:600;border:none;border-radius:10px;cursor:pointer;
      transition:transform .15s,background .2s}
    .btn:active{transform:scale(.96)}
    .btn-primary{background:#e53935;color:#fff}
    .btn-primary:hover{background:#f04a46}
    .btn-secondary{background:rgba(255,255,255,.1);color:#fff;
      border:1px solid rgba(255,255,255,.2)}
    .btn-secondary:hover{background:rgba(255,255,255,.18)}
  </style>
</head>
<body>
  <div class="error-overlay">
    <div class="error-box" role="alertdialog" aria-labelledby="err-title">
      <div class="error-icon" id="err-icon">⚠️</div>
      <div class="error-code" id="err-code">ОШИБКА</div>
      <div class="error-title" id="err-title">Что-то пошло не так</div>
      <div class="error-text" id="err-text">
        Проверьте подключение к интернету или попробуйте позже.
      </div>
      <div class="error-actions">
        <button class="btn btn-primary" onclick="location.reload()">Обновить</button>
        <button class="btn btn-secondary" onclick="location.href='/'">На главную</button>
      </div>
    </div>
  </div>
  <script>
  (function(){
    var p=new URLSearchParams(location.search);
    var r=p.get('reason')||'unknown', s=p.get('status')||'';
    var M={
      offline:  {i:'📡',t:'Нет подключения',    x:'Интернет недоступен. Проверьте сеть и попробуйте снова.'},
      notfound: {i:'🔍',t:'Страница не найдена',x:'Запрашиваемая страница не существует или была перемещена.'},
      server:   {i:'🔥',t:'Ошибка сервера',     x:'Сервер не смог обработать запрос. Попробуйте позже.'},
      network:  {i:'📡',t:'Нет связи',          x:'Не удаётся связаться с сервером. Проверьте подключение.'},
      exception:{i:'⚠️',t:'Непредвиденная ошибка',x:'Произошла ошибка при загрузке. Обновите страницу.'},
      unknown:  {i:'⚠️',t:'Что-то пошло не так',x:'Проверьте подключение или попробуйте позже.'}
    };
    var m=M[r]||M.unknown;
    document.getElementById('err-icon').textContent=m.i;
    document.getElementById('err-title').textContent=m.t;
    document.getElementById('err-text').textContent=m.x;
    document.getElementById('err-code').textContent=s?('HTTP '+s):'ОШИБКА';
  })();
  </script>
</body>
</html>
