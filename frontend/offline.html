<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Error — Voice Forge Studio</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #fff;
}

/* ФОН: ph_b2.png на весь экран. Fallback color #2a0606 */
body {
  background-color: #2a0606;
  background-image: url('/static/img/ph_b2.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
}

/* Fallback: если ph_b2.png не загрузится — показываем ph_b2.png как <img> снизу */
.bg-fallback {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}
.bg-fallback img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* КОМПАКТНЫЙ TOAST СНИЗУ — КРАСНЫЙ */
.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%) translateY(calc(100% + 40px));
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  max-width: min(520px, calc(100vw - 32px));
  padding: 12px 16px;
  background: #c62828;
  border: 2px solid #ef5350;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(198,40,40,.55),
              0 0 0 1px rgba(255,255,255,.08) inset;
  animation: slideUp .5s cubic-bezier(.34,1.56,.64,1) .15s forwards;
}
@keyframes slideUp {
  to { transform: translateX(-50%) translateY(0); }
}

.toast-icon {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  color: #ffeb3b;
  display: flex;
  align-items: center;
  justify-content: center;
}
.toast-icon svg { width: 100%; height: 100%; display: block; }

.toast-body { flex: 1; min-width: 0; }
.toast-title {
  font-size: 13.5px;
  font-weight: 700;
  color: #ffeb3b;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast-msg {
  font-size: 12px;
  color: #fff59d;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.toast-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 2px solid #ffeb3b;
  color: #ffeb3b;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.toast-btn:hover { background: rgba(255,235,59,.18); }
.toast-btn:active { transform: scale(.92); }
.toast-btn svg { width: 16px; height: 16px; display: block; }
</style>
</head>
<body>
<!-- Fallback картинка (если CSS не сработал или ph_b2 не загрузился) -->
<div class="bg-fallback" aria-hidden="true">
  <img src="/static/img/ph_b2.png" alt="" onerror="this.style.display='none'">
</div>

<div class="toast" role="alert" aria-live="assertive">
  <div class="toast-icon" id="t-icon"></div>
  <div class="toast-body">
    <div class="toast-title" id="t-title">Something Went Wrong</div>
    <div class="toast-msg" id="t-msg">Check your connection or try again.</div>
  </div>
  <button class="toast-btn" id="t-btn" onclick="sessionStorage.removeItem('jst_recovery_at'); location.reload()" title="Retry" aria-label="Retry">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
  </button>
</div>

<script>
(function(){
  var p = new URLSearchParams(location.search);
  var r = p.get('reason') || (p.get('code')==='404'?'notfound':(p.get('code')==='500'?'server':'unknown'));
  var s = p.get('status') || p.get('code') || '';

  var ICONS = {
    offline:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
    notfound:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    server:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
    network:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
    slow:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    exception: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    unknown:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
  };

  var M = {
    offline:   { t: 'No Connection',        x: 'Internet is unavailable. Check your network.' },
    notfound:  { t: 'Page Not Found',       x: 'The requested page does not exist.' },
    server:    { t: 'Server Error',         x: 'Server could not process the request.' },
    network:   { t: 'Network Error',        x: 'Unable to reach the server.' },
    slow:      { t: 'Slow Connection',      x: 'Network is slow or unstable. Try again in a moment.' },
    exception: { t: 'Loading Error',        x: 'Please refresh the page.' },
    unknown:   { t: 'Something Went Wrong', x: 'Check your connection or try again.' }
  };

  var m = M[r] || M.unknown;
  document.getElementById('t-icon').innerHTML = ICONS[r] || ICONS.unknown;
  document.getElementById('t-title').textContent = m.t + (s ? ' · HTTP ' + s : '');
  document.getElementById('t-msg').textContent = m.x;

  // v1.10.58: AUTO_RECOVERY по типу ошибки — проверяет реальное состояние
  var RECOVERY_CHECKS = {
    offline:   function() { return checkReadyz(); },
    network:   function() { return checkReadyz(); },
    exception: function() { return checkReadyz(); },
    slow:      function() { return checkReadyz(); },
    unknown:   function() { return checkReadyz(); },
    server:    function() { return checkReadyz().then(function(ok) { return ok ? checkModels() : false; }); },
    notfound:  function() { return Promise.resolve(false); }
  };

  function checkReadyz() {
    return fetch('/readyz', { cache: 'no-store', credentials: 'same-origin' })
      .then(function(r) { return r.ok; })
      .catch(function() { return false; });
  }

  function checkModels() {
    return fetch('/api/models', { cache: 'no-store', credentials: 'same-origin' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(j) {
        if (!j) return false;
        var n = Array.isArray(j) ? j.length : (j.models ? j.models.length : 0);
        return n > 0;
      })
      .catch(function() { return false; });
  }

  var check = RECOVERY_CHECKS[r];
  if (check) {
    var probe = function() {
      if (redirecting) return;
      check().then(function(ok) {
        if (ok) {
          redirecting = true;
          sessionStorage.setItem('jst_recovery_at', String(Date.now()));
          location.replace('/');
        } else {
          setTimeout(probe, 5000);
        }
      });
    };
    // Первая проверка через 2с
    setTimeout(probe, 2000);
    // При возврате сети — сразу
    window.addEventListener('online', function() {
      if (!redirecting) {
        check().then(function(ok) { if (ok) location.replace('/'); });
      }
    });
  }
  })();
</script>
</body>
</html>
