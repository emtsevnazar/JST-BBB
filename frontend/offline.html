<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ошибка — Voice Forge Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#fff}

/* ФОН: ph_b2.png на весь экран + КРАСНЫЙ overlay */
body{
  background:#2a0606 url('/static/img/ph_b2.png') center/cover no-repeat fixed;
  background-size:cover;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 40%, rgba(229,57,53,.55) 0%, rgba(80,0,0,.85) 70%, rgba(30,0,0,.95) 100%);
  z-index:1;pointer-events:none;
}
/* Всплывающая ошибка СНИЗУ */
.error-popup{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;justify-content:center;
  padding:0 clamp(.75rem,2vw,1.5rem);
  animation:slideUp .55s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes slideUp{
  from{transform:translateY(100%);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.error-box{
  width:100%;max-width:min(640px,100%);
  background:rgba(20,20,20,.96);
  border:3px solid #e53935;border-bottom:none;
  border-radius:16px 16px 0 0;
  padding:clamp(1.2rem,3vw,2rem);
  padding-bottom:clamp(1.5rem,4vw,2.5rem);
  box-shadow:0 -10px 60px rgba(229,57,53,.4),
             0 -20px 80px rgba(0,0,0,.75),
             inset 0 1px 0 rgba(255,255,255,.05);
  text-align:center;
}
.error-icon{font-size:clamp(2rem,6vw,3.5rem);line-height:1;margin-bottom:.5rem}
.error-code{display:inline-block;font-family:ui-monospace,monospace;
  font-size:.72rem;color:#ff8a80;background:rgba(229,57,53,.18);
  padding:.2rem .6rem;border-radius:6px;margin-bottom:.6rem;letter-spacing:.05em}
.error-title{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;margin-bottom:.4rem}
.error-text{font-size:clamp(.85rem,2vw,1rem);color:#c8c8c8;line-height:1.5;margin-bottom:1.2rem}
.error-actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.btn{min-height:44px;padding:.7rem 1.4rem;font-size:clamp(.85rem,2vw,1rem);
  font-weight:600;border:none;border-radius:10px;cursor:pointer;
  transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:#e53935;color:#fff}
.btn-primary:hover{background:#f04a46}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.2)}
.btn-secondary:hover{background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<div class="error-popup">
  <div class="error-box" role="alertdialog" aria-labelledby="err-title">
    <div class="error-icon" id="err-icon">⚠️</div>
    <div class="error-code" id="err-code">ОШИБКА</div>
    <div class="error-title" id="err-title">Что-то пошло не так</div>
    <div class="error-text" id="err-text">Проверьте подключение к интернету или попробуйте позже.</div>
    <div class="error-actions">
      <button class="btn btn-primary" onclick="location.reload()">Обновить</button>
      <button class="btn btn-secondary" onclick="location.href='/'">На главную</button>
    </div>
  </div>
</div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var r=p.get('reason')||(p.get('code')==='404'?'notfound':p.get('code')==='500'?'server':'unknown');
  var s=p.get('status')||p.get('code')||'';
  var M={
    offline:{i:'📡',t:'Нет подключения',x:'Интернет недоступен. Проверьте сеть и попробуйте снова.'},
    notfound:{i:'🔍',t:'Страница не найдена',x:'Запрашиваемая страница не существует или была перемещена.'},
    server:{i:'🔥',t:'Ошибка сервера',x:'Сервер не смог обработать запрос. Попробуйте позже.'},
    network:{i:'📡',t:'Нет связи',x:'Не удаётся связаться с сервером. Проверьте подключение.'},
    exception:{i:'⚠️',t:'Непредвиденная ошибка',x:'Произошла ошибка при загрузке. Обновите страницу.'},
    unknown:{i:'⚠️',t:'Что-то пошло не так',x:'Проверьте подключение или попробуйте позже.'}
  };
  var m=M[r]||M.unknown;
  document.getElementById('err-icon').textContent=m.i;
  document.getElementById('err-title').textContent=m.t;
  document.getElementById('err-text').textContent=m.x;
  document.getElementById('err-code').textContent=s?('HTTP '+s):'ОШИБКА';
})();
</script>
</body>
</html>
