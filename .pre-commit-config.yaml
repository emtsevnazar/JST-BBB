repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, backend/]
      - id: ruff-format
        args: [--check, backend/]

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest with coverage
        entry: bash -c 'cd backend && /Users/nazar/Documents/AAC/code/bin/python3 -m pytest -c ../pytest.ini tests/ -q --no-header 2>&1 | tail -5'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
