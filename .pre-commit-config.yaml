repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, backend/]
      - id: ruff-format
        args: [--check, backend/]

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest with coverage
        entry: bash -c 'set -o pipefail; .venv/bin/python -m pytest backend/tests/ -q --no-header --tb=short --cov=backend --cov-report=term-missing 2>&1 | tail -20'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      # v1.6.0: security — bandit на каждый коммит (~5 сек)
      - id: bandit
        name: bandit (security static analysis)
        entry: .venv/bin/python -m bandit -r backend/ -ll -q
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      # v1.6.0: pip-audit — manual (~2 мин, запускать перед релизом)
      - id: pip-audit
        name: pip-audit (CVE scan, manual)
        entry: bash -c 'set -o pipefail; pip-audit --desc off 2>&1 | head -30'
        language: system
        pass_filenames: false
        files: ^(requirements.*\.txt|pyproject\.toml)$
        stages: [manual]
