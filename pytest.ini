[pytest]
addopts = -q --cov=backend --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=75
testpaths = backend/tests

markers =
    slow: долгие тесты (>5s) — skip при pytest -m "not slow"
    integration: интеграционные (реальный HTTP/WS) — skip при pytest -m "not integration"
    real_engine: требует JST_REAL_ENGINE=1 + веса TTS (~2GB)
    security: security-related (rate-limit, blocklist, auth)
